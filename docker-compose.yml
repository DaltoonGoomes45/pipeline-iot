
services:
  postgres:
    image: postgres:16
    container_name: postgres-iot
    restart: unless-stopped
    environment:
      POSTGRES_USER: iot_user
      POSTGRES_PASSWORD: iot_senha
      POSTGRES_DB: iot_db
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_iot_data:/var/lib/postgresql/data

volumes:
  postgres_iot_data:
